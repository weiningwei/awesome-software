name: Refresh release dates

on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-release-dates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Refresh release dates in every list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_dates.py

      - name: Commit changes
        run: |
          if git diff --quiet -- lists; then
            echo "No release date changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          git commit -m "chore: refresh release dates"
          git push
